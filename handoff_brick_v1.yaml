handoff:
  version: "1.0"
  generated_at: "2026-06-19"

  project_identity:
    strategy_id: "Brick"
    identity: "A-share brick-chart mean-reversion candidate-ranking research project"
    plain_language: >
      Brick ranks daily candidates generated by brick_signal and selects TopN opportunities.
      Its alpha source is brick-chart reversal / mean-reversion structure, entry-day pricing,
      full-order ranking, and Brick-specific risk-control or overlay features. It is not B1
      pullback/retest, not B3 limit-up relay, and not shared infrastructure research.
    current_production_champion: "Brick V2 28-feature model"
    champion_status: "current trusted production baseline under calibrated account-level evaluation"
    decision_unit: "Daily TopN selection from brick_signal candidates"
    model_principle: "Full-order LambdaRank is preferred over TopK-only binary classification in the tested Brick setup."
    baseline_feature_groups:
      - "brick shape and brick momentum"
      - "entry-day price position"
      - "distance to shared trend/moving-average references as Brick ranking features"
      - "short-term return path"
      - "volume and turnover state"
      - "technical oscillator state"
    frozen_execution_constraint: "Do not modify the fixed state machine: Signal -> Next Open Entry -> First Red -> Green Exit."

  must_accept:
    - conclusion: "Brick V2 28-feature model is the current production champion."
      why: "Research Memory verifies that V2 remains the most reliable Brick production baseline under unified production口径; later variants have not stably replaced it at account level."
      how_to_use: "Default to V2 as the comparison baseline. Any replacement must beat V2 under fair account-level validation."
    - conclusion: "Account-level fair production evaluation outranks internal ranking metrics."
      why: "Research Memory repeatedly states that later variants may improve internal metrics but account-level comparison still favors V2."
      how_to_use: "Do not promote a model on NDCG, IC, TopK bucket metrics, or internal ranking metrics alone."
    - conclusion: "Full-order LambdaRank is preferred over TopK-only binary training."
      why: "Five-quantile LambdaRank outperformed Top5 and Top20 binary formulations in the tested Brick setup."
      how_to_use: "Do not replace full ranking with exact Top5 binary classification unless a materially different, fair account-level test proves otherwise."
    - conclusion: "Concept trend is weak negative information for Brick under tested definitions."
      why: "Stronger concept trend generally corresponded to worse forward returns for Brick signals."
      how_to_use: "Use concept trend, if used at all, as weak reverse/defensive information, not as bullish continuation alpha."
    - conclusion: "Regime and cluster information can help explanation or internal sorting, but has not replaced V2."
      why: "Cluster x Regime improved some internal Top10/Top20 ranking口径, but account-level production superiority over V2 was not proven."
      how_to_use: "Treat cluster/regime as support or segmentation, not a standalone production replacement."
    - conclusion: "No pre-trade Brick feature may use future return_pct, realized trade outcomes, or post-entry information."
      why: "Research Memory marks leaked return_pct concept resonance as failed due to future information."
      how_to_use: "Perform decision-time availability checks before testing event data or constructed features."
    - conclusion: "Brick V2 entry-open features are production-available at 09:25 only under daily_select.py semantics."
      why: "overnight_gap_pct, entry_open_to_yellow_pct, and entry_open_to_ma5_pct can use entry_date open, but their close/yellow/MA5 references must be signal-day known values."
      how_to_use: "Allow these three audited next-open fields for Brick V2; reject entry_date high/low/close, intraday future data, T+1 close-derived MA/yellow, return_pct, exit_date, exit_price, and hold_days."
    - conclusion: "Shared indicators are not Brick-owned implementations."
      why: "Project Memory says shared formulas, calculation libraries, caches, notifications, and runners belong to Shared Infrastructure."
      how_to_use: "Record only the Brick feature/gate role of shared indicators in Brick work."

  still_debated:
    - issue: "Can V5X beat V2 under fair account-level production validation?"
      current_status: "Open question. V5E/V5X suggests complementarity, but production superiority over V2 remains unproven."
      required_evidence: "Rolling PWF and account-level backtests with the same candidate pool, cost model, TopK, exit rules, and fixed execution口径."
    - issue: "Can a lower-complexity Brick model outperform current 28/49-feature baselines on risk-adjusted return?"
      current_status: "Open question."
      required_evidence: "Simplified models, preferably 15 or fewer features, tested against V2 on Sharpe, MaxDD, turnover, CAGR, and stability."
    - issue: "How stable is entry-day pricing contribution?"
      current_status: "Partial. Entry-day pricing is a major driver, but exact contribution percentage depends on attribution method and model architecture."
      required_evidence: "Contribution analysis across models, market phases, and attribution methods without quoting a fixed universal percentage."
    - issue: "Can event data interact with Brick signals in a production-safe way?"
      current_status: "Open. Management selloff showed negative statistical effect in tested alignment, but timing availability is unresolved."
      required_evidence: "Disclosure-time and ingestion-time audit before event-day or decay-window overlay tests."
    - issue: "Can Regime improve Brick through soft controls rather than hard filtering?"
      current_status: "Open. Hard filtering failed, but dynamic TopK, position sizing, or exit speed remain open."
      required_evidence: "Hold candidate pool and entry ranking fixed; vary only TopK, position caps, or exit speed across regimes."
    - issue: "Can tail factors improve Brick stop width or position sizing?"
      current_status: "Open/partial. Tail factors failed as direct entry filters but may carry risk-control information."
      required_evidence: "Tests that hold entry ranking fixed and change only stop width, position scale, or risk tags."
    - issue: "Does ATR dominate V5 clustering, and can volatility-neutral clustering help?"
      current_status: "Partial. ATR was important and clusters may partly reflect volatility state; volatility-neutral clustering is not completed."
      required_evidence: "Volatility-neutral or volatility-stratified clustering validation and account-level comparison."

  active_focus:
    - priority: 1
      focus: "Fair account-level V5X vs V2 validation."
      reason: "V5X/V5E suggests entry-day and structural information may be complementary, but only account-level superiority over V2 matters."
      expected_output: "V5X versus V2 comparison with identical candidate pool, cost model, TopK, exit rules, time range, and rolling PWF/account-level metrics."
    - priority: 2
      focus: "Lower-complexity Brick model validation."
      reason: "A simpler model that matches or beats V2 on risk-adjusted return could reduce overfitting and maintenance cost."
      expected_output: "Simplified feature-set comparison against V2 on Sharpe, MaxDD, turnover, CAGR, stability, and phase behavior."
    - priority: 3
      focus: "Regime soft control."
      reason: "Hard market-timing deletion failed, but dynamic TopK, position caps, and exit speed may improve risk without destroying the candidate pool."
      expected_output: "Soft-control experiment that keeps entry ranking fixed and changes only sizing/TopK/exit-speed by regime."
    - priority: 4
      focus: "Tail factors as risk control."
      reason: "Direct tail entry filtering failed, but tail behavior may still help stop width, position sizing, or risk tags."
      expected_output: "Risk-control overlay test with unchanged entry ranking."
    - priority: 5
      focus: "Production-available event overlays."
      reason: "Event data may interact with Brick signals, but only if available before entry and aligned by disclosure/ingestion time."
      expected_output: "Timestamp availability audit followed by constrained event overlay tests."

  do_not_repeat:
    - item: "Do not use future return_pct or realized trade outcomes as pre-trade Brick features."
      reason: "This is future leakage and invalidates the result regardless of headline performance."
    - item: "Do not compute Brick V2 entry-open features from entry_date high/low/close, intraday future data, T+1 close-derived MA/yellow, or exit/return fields."
      reason: "The valid 09:25 semantics match daily_select.py: entry_date open versus signal-day known close/yellow/MA5."
    - item: "Do not use backtest_brick_v2.py as the default exploratory AG2 research runner."
      reason: "backtest_brick_v2.py is the production signal generator; exploratory AG2 work must use research-only runners or backtest_brick_v2_research.py unless explicitly reproducing production."
    - item: "Do not use Brick concept resonance in the leaked return_pct form."
      reason: "That construction is invalid for production research."
    - item: "Do not keep iterating on conc_daily or conc_overnight simple daily linear concept resonance as the main Brick alpha path."
      reason: "The tested forms did not improve clean forward production evaluation versus the Brick baseline."
    - item: "Do not inject Alpha101, GTJA191, or Qlib158 naively into Brick V2."
      reason: "The tested libraries were mismatched to Brick mean-reversion state and added noise rather than robust incremental alpha."
    - item: "Do not treat concept trend as positive continuation alpha under the tested definitions."
      reason: "The tested direction conflicts with Brick mean-reversion dynamics; concept trend is weak negative information."
    - item: "Do not use extreme tail factors as direct entry filters."
      reason: "They behaved like volatility amplifiers, not directional entry signals."
    - item: "Do not frame one-word-limit-up or strong-stock leadership as a standalone Brick ranker."
      reason: "The effect was statistically visible but did not become robust standalone production alpha."
    - item: "Do not use hard market-timing filters to remove large blocks of Brick candidates."
      reason: "The tested form reduced production performance while only modestly helping drawdown."
    - item: "Do not replace full-order ranking with Top5 exact binary classification."
      reason: "Class imbalance and loss of full-order ranking gradient weakened the model."
    - item: "Do not claim V2C 19-feature reduction or V5E as production replacement for V2."
      reason: "Neither has proven production replacement status under fair account-level comparison."
    - item: "Do not modify the fixed state machine Signal -> Next Open Entry -> First Red -> Green Exit."
      reason: "Snapshot records it as a frozen execution constraint for fair validation."

  common_mistakes:
    - mistake: "Declaring a model better than V2 from internal ranking metrics."
      correction: "Require fair account-level production validation before replacement."
    - mistake: "Treating V5/V5E/V5X as already superior because they improve some internal sorting metrics."
      correction: "They are promising or frozen research artifacts, not production champions."
    - mistake: "Using leaked future outcomes or post-entry fields in concept or event features."
      correction: "Audit decision-time availability first; reject unavailable fields."
    - mistake: "Rejecting Brick V2 entry_open_to_yellow_pct or entry_open_to_ma5_pct merely because they use entry_date open."
      correction: "They are allowed only under daily_select.py semantics: entry_date open versus signal-day known yellow/MA5. The forbidden part is using entry_date high/low/close, intraday future data, or T+1 close-derived references."
    - mistake: "Changing or importing the production Brick V2 script for exploratory AG2 experiments."
      correction: "Keep exploration in research-only code paths and record any explicit production reproduction exception."
    - mistake: "Turning weak negative concept trend into bullish continuation alpha."
      correction: "Under tested definitions, concept strength is reverse/defensive information for Brick."
    - mistake: "Using regime as a hard entry deletion switch."
      correction: "If using regime, test soft controls such as dynamic TopK, position sizing, or exit speed."
    - mistake: "Reopening failed external factor libraries by simple concatenation."
      correction: "Only consider materially different structured, orthogonalized, or ensemble approaches with incremental account-level validation."
    - mistake: "Mixing B1 wave-quality or B3 limit-up relay logic into Brick memory."
      correction: "Classify by alpha source; Brick acts on brick_signal candidates and Brick ranking/risk control."
    - mistake: "Changing candidate pool, cost model, TopK, exit rules, or state machine when comparing models."
      correction: "Keep all comparison口径 identical unless the test explicitly isolates that variable."
    - mistake: "Quoting a fixed contribution percentage for entry-day pricing."
      correction: "Use entry-day pricing as directionally important, but do not treat any percentage as universal."

  escalation_conditions:
    - condition: "A new model appears to beat V2."
      action: "Stop and verify candidate pool, cost model, TopK, exit rules, state machine, time range, leakage, and account-level metrics before accepting replacement."
    - condition: "A feature uses return_pct, realized trade outcomes, event information, or data whose publication time is unclear."
      action: "Reject or pause until decision-time availability and timestamp alignment are proven."
    - condition: "A Brick V2 proposal uses overnight_gap_pct, entry_open_to_yellow_pct, or entry_open_to_ma5_pct."
      action: "Verify daily_select.py semantics: entry_date open is allowed, but signal-day known close/yellow/MA5 must be the references and entry_date high/low/close or T+1 close-derived references are forbidden."
    - condition: "An exploratory AG2 Brick run touches backtest_brick_v2.py."
      action: "Pause and confirm whether this is explicit production reproduction; otherwise move the work to backtest_brick_v2_research.py or a research-only runner."
    - condition: "A result improves ranking metrics but not account-level performance."
      action: "Do not promote to production. Keep it as diagnostic or internal-sorting evidence only."
    - condition: "A regime or market-timing rule removes large blocks of candidates."
      action: "Treat as likely repetition of a failed path; retest only as soft TopK/sizing/exit-speed control."
    - condition: "A proposed model changes the fixed state machine."
      action: "Do not proceed without explicit user approval and a separate experiment label; it is no longer a fair champion comparison."
    - condition: "A result contradicts Brick Memory or claims a failed direction now works."
      action: "Require proof that construct, implementation, data availability, and evaluation口径 differ from the failed test."
    - condition: "A shared indicator, runner, cache, or notification mechanism is being described as Brick alpha."
      action: "Reclassify as Shared Infrastructure and record only Brick-specific feature/gate usage."
    - condition: "A result depends heavily on V5 clusters."
      action: "Check whether ATR or volatility state dominates; consider volatility-neutral or volatility-stratified validation."
    - condition: "Broadly abnormal results appear."
      action: "Stop and audit data, cache, date ordering, GBK CSV handling, split/purge, model artifacts, and execution assumptions before running more experiments."

  first_day_tasks:
    - task: "Read the three primary Brick sources in order: project memory, research memory, then snapshot."
      purpose: "Internalize Brick identity, V2 champion status, verified/failed directions, and current priorities before touching code."
      deliverable: "A one-page Brick takeover note: baseline, forbidden paths, open questions, and comparison口径."
    - task: "Identify the exact V2 28-feature baseline artifacts and reproduction path."
      purpose: "Avoid comparing against the wrong model, wrong feature set, or wrong evaluation口径."
      deliverable: "Baseline checklist covering candidate pool, features, model, TopK, cost model, exit rules, state machine, data range, and metrics."
    - task: "Audit Brick V2 09:25 entry-open feature semantics and production/research script separation."
      purpose: "Prevent future-function leakage and avoid accidental edits to the production signal generator."
      deliverable: "Checklist confirming daily_select.py entry-open formulas and that exploratory work uses research-only runners."
    - task: "Design the next fair comparison before running it."
      purpose: "The highest ROI work is V5X/low-complexity vs V2 under identical account-level口径."
      deliverable: "Experiment spec with fixed baseline, changed variable, validation method, metrics, and failure-stop checks."
    - task: "Audit feature availability for any event or concept overlay before modeling."
      purpose: "Prevent future-function leakage and timestamp-alignment errors."
      deliverable: "Decision-time availability table for proposed non-price/event features."

  first_week_tasks:
    - task: "Run or prepare fair account-level V5X versus V2 validation."
      deliverable: "Rolling PWF/account-level comparison using same candidate pool, cost model, TopK, exit rules, and state machine."
    - task: "Test lower-complexity Brick model against V2."
      deliverable: "Simplified feature-set report with Sharpe, MaxDD, turnover, CAGR, stability, trade count, and phase breakdown."
    - task: "Evaluate regime soft control without candidate deletion."
      deliverable: "Dynamic TopK / position cap / exit-speed comparison with entry ranking fixed."
    - task: "Evaluate tail factors as risk controls only."
      deliverable: "Stop-width, sizing, or risk-tag overlay test with unchanged entry ranking."
    - task: "Perform event-data availability audit before any event overlay."
      deliverable: "Timestamp-aligned event feature eligibility report."
    - task: "If V5 clustering is used, check ATR/volatility dominance."
      deliverable: "Volatility dominance diagnostic and optional volatility-neutral or stratified validation plan."
    - task: "Update Brick memory only after evidence is produced."
      deliverable: "New verified/failed/partial/open-question entries with exact scope, limitations, and production口径."

  when_to_reopen_failed_directions:
    - direction: "Naive Alpha101 / GTJA191 / Qlib158 injection"
      reopen_only_if:
        - "The approach is no longer naive concatenation."
        - "Features are orthogonalized, structured, or ensemble-tested against V2."
        - "The evaluation is incremental, no-leakage, and account-level."
      default_action: "Do not repeat."
    - direction: "Concept resonance"
      reopen_only_if:
        - "It does not use future return_pct or realized outcomes."
        - "It is not the same conc_daily / conc_overnight simple daily linear aggregation."
        - "It uses production-available inputs and proves incremental account-level value over V2."
      default_action: "Reject leaked and simple daily-linear forms."
    - direction: "Positive concept trend"
      reopen_only_if:
        - "The trend definition is materially different from the failed MA/trend definitions."
        - "The test explicitly compares positive continuation versus weak reverse usage."
        - "Account-level evidence supports the new direction."
      default_action: "Use concept trend only as weak reverse/defensive information."
    - direction: "Extreme tail factors"
      reopen_only_if:
        - "They are used as stop-width, position sizing, or risk tags, not direct entry filters."
        - "Entry ranking is held fixed."
      default_action: "Do not use as direct entry filters."
    - direction: "Leadership / one-word-limit-up / strong-stock peer effects"
      reopen_only_if:
        - "The test frames them as defensive, event-overlay, or interaction information."
        - "It does not claim standalone ranker status without fair account-level proof."
      default_action: "Do not treat as standalone Brick ranker."
    - direction: "Hard market-timing"
      reopen_only_if:
        - "The new design keeps the candidate pool intact and changes only TopK, position caps, or exit speed."
      default_action: "Do not delete large blocks of Brick candidates."
    - direction: "TopK binary classification"
      reopen_only_if:
        - "The formulation preserves enough ranking gradient or proves account-level superiority against full-order LambdaRank."
      default_action: "Prefer full-order ranking."
    - direction: "V2C or V5E as replacement"
      reopen_only_if:
        - "A fair account-level comparison shows superiority over V2 under the same production口径."
      default_action: "Treat as research artifact, not champion."

  success_definition:
    next_phase_success:
      - "V5X and/or lower-complexity model is fairly compared against V2 at account level; V2 remains champion unless clearly beaten."
      - "Any proposed replacement uses the same candidate pool, cost model, TopK, exit rules, and fixed state machine unless explicitly testing one isolated change."
      - "All new features are confirmed available before entry and free of future-function leakage."
      - "Regime, tail, event, leadership, and concept information are used only in forms consistent with Research Memory limitations."
      - "The next research priority is clarified: model replacement, low-complexity simplification, soft regime control, tail risk control, or event overlay."
      - "Brick conclusions remain inside brick_signal candidate ranking/risk-control boundary and do not import B1/B3 alpha or shared infrastructure ownership."
    not_success:
      - "A model is promoted from ranking metrics without account-level proof."
      - "A high-return result uses leaked future fields or unaligned event timestamps."
      - "A failed path is repeated under a new name with the same construct."
      - "V2 is displaced by V5E/V5X/V2C without fair production comparison."
      - "Shared indicator formulas or runners are written as Brick-owned alpha."
      - "The fixed state machine is changed during a champion comparison."

  recommended_reading_order:
    - order: 1
      file: "project_brick_v2.yaml"
      reason: "Defines Brick identity, boundary, current V2 champion, feature groups, constraints, and known dead ends."
    - order: 2
      file: "brick_memory.yaml"
      reason: "Highest-priority research truth: verified conclusions, failed directions, partial findings, open questions, and do-not-repeat rules."
    - order: 3
      file: "snapshot_brick.yaml"
      reason: "Current state panel: production baseline, active focus, highest ROI hypotheses, risks, unknowns, and first task."
    - order: 4
      file: "project_shared_v2.yaml"
      reason: "Read only after Brick boundary is clear; use it for shared trend-line ownership, caches, validation principles, and infrastructure separation."
    - order: 5
      file: "V2/V5/V5E/V5X/WF3 research artifacts and reproduction scripts"
      reason: "Use only to reproduce or validate the current champion and candidate challengers; do not let old artifacts override Brick Research Memory without fresh evidence."
