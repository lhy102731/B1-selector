project:
  name: "Brick Strategy Memory"
  strategy_id: "Brick"
  version: "2.0"
  strategy_type: "A-share brick-chart mean-reversion candidate ranking strategy"

  boundary:
    belongs_to: "Brick"
    alpha_source_rule: >
      Belongs to Brick only if the alpha comes from brick_signal candidates, brick-chart
      reversal/mean-reversion structure, or ranking/risk-control features designed for those candidates.
    excludes:
      - "B1 accumulation-wave shrink-volume pullback alpha"
      - "B3 limit-up relay / next-day continuation alpha"
      - "Shared data, cache, notification, orchestration, indicator-library, and generic backtest infrastructure"
    shared_references_policy: >
      Shared indicators may be referenced only by their Brick feature/gating role. Indicator
      formulas, calculation libraries, storage, notifications, caches, and runners are recorded
      in project_shared_v2.yaml.

  objective: >
    Rank A-share candidates generated by brick-chart signals and select the best daily TopN
    opportunities. Brick is a candidate-ranking research project around brick_signal and
    mean-reversion structure. It is not B1 pullback/retest and not B3 limit-up relay.

  market: "China A-share equities"
  holding_period: >
    Short-term to swing; this memory records Brick alpha and candidate ranking, not generic
    shared backtest mechanics.

  alpha_source:
    primary: "Brick chart mean-reversion signal and candidate ranking."
    secondary: "Entry-day pricing structure, including price position relative to shared trend/moving-average references and gaps."
    tertiary: "Full-order ranking over the daily candidate pool rather than TopK-only binary classification."
    auxiliary:
      - "Concept trend as weak reverse information."
      - "Regime and cluster information as segmentation or ranking support."
      - "Tail behavior as possible risk-control information."
    not_alpha:
      - "B1 pullback/retest quality after accumulation wave."
      - "B3 strong-stock limit-up relay."
      - "Shared indicator formulas, data fetching, caching, notification, and orchestration."

  strategy_summary:
    base_signal: "brick_signal"
    base_signal_description: >
      Brick indicator turns from green to red, red height satisfies the Brick threshold,
      and the Brick-specific trend gate passes. Shared trend-line formulas live in project_shared_v2.yaml.
    ranking_problem: "Given brick_signal candidates, rank them daily and choose TopN."
    model_style: "Full-order LambdaRank is preferred over TopK-only binary classification in the tested Brick setup."
    production_evaluation_principle: "Account-level fair production evaluation is required; internal ranking metrics alone are insufficient proof."
    s1_usage_boundary: >
      S1-like no-distribution information may appear as a Brick feature or tested dead-end,
      but the physical detector/indicator-library ownership is shared and recorded in project_shared_v2.yaml.

  current_status:
    summary: "Brick has multiple research generations: V2, V2C, V4, V5, V5E, V5X direction, and market-structure/regime branches."
    current_production_version: "Brick V2"
    current_best_model: "Brick V2 28-feature model under calibrated production evaluation."
    current_best_feature_set: "Brick V2 28 handcrafted features."
    frozen_candidate: "V5E is a frozen research version but is not confirmed as a production replacement for V2."

  current_best_feature_set:
    name: "Brick V2 28 features"
    high_level_groups:
      - "brick shape and brick momentum"
      - "entry-day price position"
      - "distance to shared trend/moving-average references as Brick ranking features"
      - "short-term return path"
      - "volume and turnover state"
      - "technical oscillator state"
    note: "The project-level conclusion is that V2 28 features remain the trusted production baseline; feature-level implementation may vary by script generation."

  core_signal_family:
    name: "Brick chart signal plus mean-reversion ranking"
    decision_unit: "Daily TopN selection from brick_signal candidates."
    important_principle: "Do not mix B1 wave-quality logic or B3 limit-up relay logic into Brick memory unless separately validated as Brick candidate features."

  current_research_focus:
    - "Determine whether V5X can beat V2 under fair account-level production validation."
    - "Test whether lower-complexity Brick models can outperform current 28/49-feature baselines on risk-adjusted return."
    - "Study event data interaction with Brick signals only after confirming real-time availability before entry."
    - "Use regime through dynamic TopK, position sizing, or exit speed rather than hard candidate deletion."
    - "Test tail factors as risk tags, stop-width inputs, or sizing controls, not direct entry filters."

  known_constraints:
    - "V2 28-feature model is the current trusted Brick production baseline."
    - "Ranking metrics alone do not prove production replacement; account-level fair comparison is required."
    - "Do not use future return_pct or realized trade outcomes as pre-trade features."
    - "Brick V2 09:25 entry-open features are valid only under daily_select.py semantics: entry_date open versus signal-day known close/yellow/MA5."
    - "Do not use entry_date high/low/close, intraday future data, T+1 close-derived MA/yellow, return_pct, exit_date, exit_price, or hold_days as Brick V2 model inputs."
    - "Keep Brick production and AG2 exploratory scripts separated: backtest_brick_v2.py is production; exploratory research uses research-only runners or backtest_brick_v2_research.py unless explicitly reproducing production."
    - "Cluster and regime information can support explanation or sorting, but has not replaced V2."
    - "Leadership-like information is not a standalone Brick ranker; it may only be considered as defensive, conditional, or interaction information."
    - "Hard market-timing filters that remove large blocks of candidates have failed in tested Brick contexts."
    - "Shared indicator implementations must not be treated as Brick-owned modules."

  known_dead_ends:
    - "Naive injection of Alpha101, GTJA191, or Qlib158 factor libraries into Brick V2."
    - "Brick concept resonance built from future-leaked return_pct or realized trade outcomes."
    - "Brick concept resonance built from simple daily linear aggregations such as conc_daily or conc_overnight."
    - "Treating concept trend as a positive continuation signal under the tested definitions."
    - "Extreme tail factors as direct Brick entry filters."
    - "One-word-limit-up or strong-stock leadership as a standalone Brick ranker."
    - "Hard market-timing filters for broad candidate elimination."
    - "Top5 exact binary classification replacing full-order ranking."
    - "V2C 19-feature reduction as a production replacement for V2."
    - "V5E as a confirmed replacement for V2; it remains a frozen candidate/research artifact."

  recommended_starting_context:
    - "Understand Brick as a brick_signal candidate-ranking project."
    - "Use Brick memory and V2/V5/V5E/V2S/WF3 research artifacts only within the Brick boundary."
    - "Default to V2 28-feature model as production baseline unless a fair account-level validation proves otherwise."
    - "When using overnight_gap_pct, entry_open_to_yellow_pct, or entry_open_to_ma5_pct, first confirm they match daily_select.py 09:25 semantics."
    - "For AG2 exploratory work, avoid touching backtest_brick_v2.py; use backtest_brick_v2_research.py or a research-only runner."
    - "Classify new material as Brick only if it acts on brick_signal candidates or Brick ranking/risk control."
    - "When a shared indicator appears in Brick, record only its Brick feature/gate role here and keep implementation/formula ownership in project_shared_v2.yaml."
