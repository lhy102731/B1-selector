      deliverable: "Candidate count, trade count, return, drawdown, win rate, phase performance, and failure taxonomy."
    - task: "Run controlled B3-specific holding/exit comparisons."
      deliverable: "Exit-rule comparison table and recommended baseline exit assumption."
    - task: "Analyze whether B3 needs candidate ranking."
      deliverable: "Candidate distribution and return dispersion report; decision on pure rule scan vs. ranking layer."
    - task: "If and only if baseline is valid, run explicit threshold robustness grid."
      deliverable: "Sensitivity table for return threshold, gap, shadow, and volume-ratio zones."
    - task: "Update b3_memory.yaml with first evidence."
      deliverable: "B3-specific verified/failed/partial/open-question entries with exact constraints and no cross-strategy contamination."

