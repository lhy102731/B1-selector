      current_status: "Unknown in Snapshot."
      what_is_debated: "Yesterday >=9%, today 2%-4%, volume ratio 0.6-0.9, gap <1%, and shadow <=2% may be robust zones or empirical rules."
      required_evidence: "Explicit grid tests with fixed sample design and no silent threshold changes."
    - issue: "Whether market emotion or index regime should control B3 participation."
      current_status: "Unknown in Snapshot."
      what_is_debated: "B3 relay may be sensitive to sentiment, liquidity, limit-up ecology, and next-day execution price."
      required_evidence: "Regime-conditioned B3 performance, but only after the base B3 sample and exit logic exist."

  active_focus:
    - priority: 1
      focus: "Build independent B3 sample and backtest record."
      reason: "B3's largest current gap is lack of independent, reproducible evidence."
      expected_output: "Candidate counts, trade counts, returns, drawdown, win rate, phase performance, and failure case taxonomy."
    - priority: 2
      focus: "Define and validate B3-specific holding and exit rules."
      reason: "A relay scanner without exit logic cannot prove tradability."
      expected_output: "Comparison of B3-specific stop, take-profit, failed-continuation, trend-break, and holding-period rules."
    - priority: 3
      focus: "Decide whether B3 needs a ranking layer."
      reason: "Ranking should be introduced only if candidate volume and return dispersion justify it."
      expected_output: "Decision report: pure scanner vs. B3-specific TopN ranking, with candidate distribution evidence."
    - priority: 4
      focus: "Initialize B3 research memory governance."
      reason: "b3_memory.yaml is currently empty, so first validated and failed findings must be recorded carefully."
      expected_output: "Updated B3 memory entries with verified/failed/partial/open-question classification and exact limitations."

  do_not_repeat:
    - item: "Do not inherit B1 V3 pullback, wave-quality, bowl-position, or shrink-volume retest conclusions as B3 evidence."
      reason: "B1 alpha source is accumulation-wave pullback, while B3 alpha source is prior-day strong rise plus next-day controlled continuation."
    - item: "Do not inherit Brick V2/V5 chart reversal, LambdaRank, or brick_signal candidate-ranking conclusions as B3 evidence."
      reason: "Brick is a separate mean-reversion candidate-ranking project."
    - item: "Do not invent B3 failed directions."
      reason: "b3_memory.yaml currently records no failed directions. Failed status requires B3-specific evidence."
    - item: "Do not add complex fusion or ML ranking before a baseline B3 backtest exists."
      reason: "Snapshot explicitly says not to stack complex models before baseline evidence."
    - item: "Do not treat shared white/yellow trend-line formulas, caches, runners, or notifications as B3-owned alpha."
      reason: "Shared indicator and infrastructure ownership belongs to Shared Infrastructure; B3 records only gate usage."
    - item: "Do not silently change thresholds, sample range, or test design for speed."
      reason: "B3 needs clean first evidence; altered scope would pollute the initial research memory."

  common_mistakes:
    - mistake: "Assuming B3 is already a proven champion because a scanner exists."
      correction: "Treat B3XG as a baseline to validate; independent research evidence is still sparse."
    - mistake: "Starting from B1 or Brick reports because they are more mature."
      correction: "Use B1 and Brick only as negative boundary references; B3 evidence must be independent."
    - mistake: "Adding ML ranking before measuring candidate count and return dispersion."
      correction: "First establish whether candidate selection pressure exists."
    - mistake: "Backtesting entry rules without specifying holding and exit assumptions."
      correction: "Every B3 baseline result must state its holding, stop, take-profit, and exit logic explicitly."
    - mistake: "Calling shared trend-line gates B3 alpha."
      correction: "They are B3-specific gates using shared formulas; ownership remains shared."
    - mistake: "Recording empty-memory gaps as negative conclusions."
      correction: "No recorded B3 failure means unknown, not failed."
    - mistake: "Optimizing thresholds before confirming the base sample and implementation are correct."
      correction: "First reproduce the scanner and basic backtest; only then run explicit grid tests."

  escalation_conditions:
    - condition: "B3 baseline backtest produces extremely high or extremely poor results."
      action: "Stop; audit signal generation, date alignment, next-day execution assumptions,涨跌停 handling, market-cap availability, and exit logic before accepting results."
    - condition: "A proposed feature or rule comes from B1 pullback or Brick reversal logic."
      action: "Reject as B3 evidence unless it is redefined and independently validated as prior-day strong-rise plus next-day controlled-continuation alpha."
    - condition: "A proposed B3 model uses data unavailable before the trade decision."
      action: "Reject for production research unless decision-time availability is proven."
    - condition: "Candidate counts are too small or too large for the intended analysis."
      action: "Do not silently alter thresholds; report the issue and ask before changing scope."
    - condition: "Ranking metrics improve but account-level results do not."
      action: "Do not promote the ranking layer; B3 needs tradable account-level improvement."
    - condition: "A result would become the first verified or failed B3 memory entry."
      action: "Record exact sample range, rules, exit assumptions, metrics, limitations, and whether it is verified/failed/partial/open question."
    - condition: "Shared runner, cache, or indicator behavior appears to determine results."
      action: "Separate infrastructure mechanics from B3 alpha; check Shared Infrastructure memory if needed."

  first_day_tasks:
