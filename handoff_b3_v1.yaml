      current_status: "Open focus in Project Memory and Snapshot."
      what_is_debated: "If B3 candidates are sparse, rules may be enough; if candidates are numerous or uneven, B3-specific TopN ranking may be required."
      required_evidence: "Candidate count distribution, return distribution, and performance by candidate quality buckets."
    - issue: "What B3-specific holding and exit rules should be."
      current_status: "Not yet established."
      what_is_debated: "B3 is a short-term relay setup, so outcome may depend heavily on post-signal exit, stop, take-profit, and failed-continuation handling."
      required_evidence: "Controlled comparisons of B3-specific exit rules under the same entry baseline."
