registry:
  experiments:
  - id: shared-infra-001
    title: Shared Infrastructure ownership boundary and alpha-source classification rule
    category: other
    status: VERIFIED
    short_result: Shared Infrastructure owns reusable data, cache, config, notification, indicator, orchestration, UI, and
      backtest mechanisms; it must not own B1/B3/Brick alpha conclusions.
    evidence_source:
    - project_shared_v2.yaml
    - shared_memory.yaml
    - snapshot_shared.yaml
    - handoff_shared_v1.yaml
    reopen_condition: Reopen when classifying mixed outputs or files that contain both generic execution mechanics and strategy-specific
      signal/ranking conclusions.
  - id: shared-infra-002
    title: 'Cross-strategy validation governance: PWF, OOS-first, account-level-first'
    category: validation_framework
    status: VERIFIED
    short_result: Shared memory establishes Purged Walk-Forward/OOS-first validation, account-level metrics over ranking metrics,
      no future-function leakage, and bounded FAILED conclusions as repository-wide rules.
    evidence_source:
    - shared_memory.yaml
    - snapshot_shared.yaml
    - handoff_shared_v1.yaml
    reopen_condition: Reopen only to refine the standard or add stronger evidence; do not relax these rules for production
      research.
  - id: shared-infra-003
    title: 'Shared indicator library: white line, yellow line, S1 detector boundary'
    category: feature_layer
    status: VERIFIED
    short_result: White-line/yellow-line formulas and S1 detector physical implementation are shared infrastructure; strategy-specific
      usage and results belong to individual strategy memories.
    evidence_source:
    - project_shared_v2.yaml
    - snapshot_shared.yaml
    - CLAUDE.md
    - utils/s1_filter.py
    - utils/technical.py
    reopen_condition: Reopen if formulas or detector implementation change, or if a strategy tries to claim physical ownership
      of shared indicators.
  - id: shared-infra-004
    title: Shared data fetch layer with baostock, Tencent, mootdx, akshare fallback paths
