      local stock-name caches, and fallback data sources.
    evidence_source:
    - utils/akshare_fetcher.py
    - README.md
    - project_shared_v2.yaml
    reopen_condition: Reopen when changing data providers, field mapping, retry behavior, adjustment method, or production
      data availability assumptions.
  - id: shared-infra-005
    title: CSV storage convention and GBK/date-order handling
    category: data_layer
    status: VERIFIED
    short_result: CSVManager stores stock data under data/{prefix}/{code}.csv, reads GBK/UTF-8, writes GBK, sorts reverse
      chronological, deduplicates by date, and blocks overwriting unreadable nonempty files.
    evidence_source:
    - utils/csv_manager.py
    - CLAUDE.md
    - project_shared_v2.yaml
    reopen_condition: Reopen if storage encoding, file order, prefixes, or read/write semantics change; date order is a high-risk
      backtest/cache dependency.
