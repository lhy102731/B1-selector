do_not_repeat:
  - item: "Do not use future return_pct or realized trade outcomes as pre-trade Brick features."
    reason: "They leak future information."

  - item: "Do not use Brick concept resonance in the leaked return_pct form."
    reason: "That construction is invalid for production research."

  - item: "Do not use concept trend as positive prediction under the tested definitions."
    reason: "The tested direction conflicts with Brick mean-reversion dynamics."

  - item: "Do not use extreme tail factors as direct Brick entry filters."
    reason: "They behaved as volatility amplifiers, not directional filters."

  - item: "Do not use hard market-timing filters to remove large blocks of Brick candidates."
    reason: "The tested form reduced production performance."
