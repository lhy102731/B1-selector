strategy_type: "brick"

verified:
  - conclusion: "The current trusted Brick production baseline is the V2 28-feature model under calibrated production evaluation."
    scope:
      strategies: ["Brick"]
      alpha_source: "Mean Reversion / Ranking Features"
      market: "A-share"
      time_interval: "2016-2026"
    key_evidence:
      - "V2 28 handcrafted features remain the most reliable Brick production baseline under unified production口径."
      - "External factor libraries, V4 internal extensions, and V5 cluster features did not stably replace V2 at account level."
      - "Later variants may improve some internal ranking metrics, but account-level fair comparison still favors V2."
    limitations: "This is a Brick-specific baseline. It should be revalidated periodically if A-share microstructure changes."

  - conclusion: "Brick ranking should use full-order LambdaRank rather than TopK-only binary training."
    scope:
      strategies: ["Brick"]
      alpha_source: "Ranking Features / LambdaRank / TopK Selection"
      market: "A-share"
      time_interval: "2016-2026"
    key_evidence:
      - "Five-quantile LambdaRank outperformed Top5 and Top20 binary formulations in the tested Brick setup."
      - "Full ranking preserves ordering gradient across the candidate pool and better matches daily TopN decision making."
    limitations: "Applies to Brick mean-reversion candidate ranking. Other alpha families require independent validation."

  - conclusion: "Concept trend is a stable weak negative signal for Brick."
    scope:
      strategies: ["Brick"]
      alpha_source: "Concept Trend as Reverse Information"
      market: "A-share"
      time_interval: "2016-2026"
    key_evidence:
      - "Stronger concept trend generally corresponded to worse forward returns for Brick signals."
      - "MA-based trend definitions showed stable negative direction in the tested period."
      - "The effect is weak and should not be treated as a primary standalone alpha."
    limitations: "Validated only in the tested market regime. Direction may change in untested extreme bull markets or after major microstructure changes."

  - conclusion: "Brick regime and cluster information can help internal sorting, but has not replaced V2 at production level."
    scope:
      strategies: ["Brick"]
      alpha_source: "Regime on Mean Reversion / Clustering"
      market: "A-share"
      time_interval: "2016-2026"
    key_evidence:
      - "Cluster x Regime interaction improved internal Top10/Top20 ranking口径 in the V5 family."
      - "Seven clusters were relatively stable across tested periods."
      - "Account-level production superiority over V2 was not proven."
    limitations: "Use for Brick segmentation and ranking support, not as standalone proof of model replacement."

failed:
