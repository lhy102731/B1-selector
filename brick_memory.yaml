    scope:
      strategies: ["Brick"]
      alpha_source: "Ranking Features"
      market: "A-share"
      time_interval: "2016-2026"
    failure_reason: "The tested factor libraries were mismatched to Brick mean-reversion state and added noise rather than robust incremental alpha."
    do_not_repeat_reason: "Do not reuse the same naive concatenation approach as a Brick production feature path."
    limitations: "This does not rule out all alternative data or more structured ensemble/orthogonalized approaches."

  - failure: "Concept resonance built from future return_pct."
    scope:
      strategies: ["Brick"]
      alpha_source: "Concept Resonance"
      market: "A-share"
      time_interval: "2016-2026"
    failure_reason: "return_pct uses future exit information and is unavailable before or at entry."
    do_not_repeat_reason: "Do not construct any pre-trade Brick feature from realized future trade returns."
    limitations: "This invalidates the leaked return_pct construction, not every possible concept-resonance design."

  - failure: "Concept resonance built from conc_daily and conc_overnight daily linear aggregations."
    scope:
      strategies: ["Brick"]
      alpha_source: "Concept Resonance"
      market: "A-share"
      time_interval: "2016-2026"
    failure_reason: "The tested daily aggregation forms did not improve clean forward production evaluation versus the Brick baseline."
    do_not_repeat_reason: "Do not keep iterating on these exact daily linear aggregations as the main Brick alpha path."
    limitations: "Other non-daily, nonlinear, volume-weighted, or signal-density resonance constructions remain unclosed."

  - failure: "Positive concept-trend alpha under the tested MA/trend definitions."
    scope:
      strategies: ["Brick"]
      alpha_source: "Concept Trend"
      market: "A-share"
      time_interval: "2016-2026"
    failure_reason: "The tested positive-trend definitions conflicted with Brick mean-reversion dynamics and did not produce a robust positive alpha."
    do_not_repeat_reason: "Do not treat concept strength as a bullish continuation signal for Brick under the tested definitions."
    limitations: "Concept trend remains valid as weak reverse information. Untested definitions require separate validation."

  - failure: "Extreme tail factor as a direct Brick entry filter."
    scope:
      strategies: ["Brick"]
      alpha_source: "Tail Risk / Mean Reversion Risk Control"
      market: "A-share"
      time_interval: "2016-2026"
    failure_reason: "The tested tail factors behaved more like volatility amplifiers than directional entry signals."
    do_not_repeat_reason: "Do not use these tail factors as direct buy filters for Brick."
    limitations: "They may still be useful for risk labels, stop width, or position sizing."

  - failure: "One-word-limit-up / strong-stock leadership as a standalone Brick ranker alpha."
    scope:
      strategies: ["Brick"]
      alpha_source: "Leadership"
      market: "A-share"
      time_interval: "2016-2026"
    failure_reason: "The leadership effect was statistically visible but did not convert into robust standalone production alpha."
    do_not_repeat_reason: "Do not keep framing this signal as an independent Brick ranker."
    limitations: "Leadership-like information may still matter as a defensive, event-overlay, or interaction feature."

  - failure: "Hard market-timing filtering for Brick candidate elimination."
    scope:
      strategies: ["Brick"]
      alpha_source: "Regime on Mean Reversion"
      market: "A-share"
      time_interval: "2016-2026"
    failure_reason: "Removing a large share of candidates hurt production outcome while only modestly helping drawdown."
    do_not_repeat_reason: "Do not use regime timing as a blunt hard filter for Brick entry selection."
    limitations: "Soft regime controls such as dynamic TopK, position sizing, or exit speed remain open."

  - failure: "Top5 exact binary classification for Brick ranking."
    scope:
      strategies: ["Brick"]
      alpha_source: "TopK Selection / Ranking"
      market: "A-share"
      time_interval: "2016-2026"
    failure_reason: "The class imbalance and loss of full-order ranking gradient weakened the model."
    do_not_repeat_reason: "Do not replace full ranking with Top5-only binary training in the tested Brick setup."
    limitations: "This applies to the tested Brick ranking formulation."

