      - "The quoted contribution ratio depended on the chosen decomposition method."
    limitations: "Use as a directional Brick conclusion, not as a fixed universal percentage."

  - conclusion: "Brick V2 09:25 entry-open fields are valid only under daily_select.py semantics."
    scope:
      strategies: ["Brick"]
      alpha_source: "Entry-Day Pricing"
      market: "A-share"
      time_interval: "2016-2026"
    current_valid: "overnight_gap_pct, entry_open_to_yellow_pct, and entry_open_to_ma5_pct may use entry_date open because the open price is available at 09:25 before selection."
    unverified: "Any implementation that recomputes references from entry_date high/low/close, intraday future data, or T+1 close-derived MA/yellow is not covered by this conclusion."
    key_evidence:
      - "daily_select.py computes the audited next-open fields from entry_date open and signal-day known references."
      - "The production/research split was restored: backtest_brick_v2.py is production and backtest_brick_v2_research.py is exploratory research."
    limitations: "This is a decision-time availability boundary, not proof that the fields improve account-level performance in every validation."

